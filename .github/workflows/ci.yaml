# curl CI (project-specific — this repo builds a C tool, not Go, so it
# diverges from the canonical baseline ci.yaml). Construction rules are the
# same: the only marketplace action is GitHub's own checkout pinned by commit
# SHA; everything else is pinned, checksum-verified shell via aqua + just.
#
# Two jobs:
#   lint  — the shared limen lint lane (shell/yaml/just/links/commits), once.
#   build — every release leg on its NATIVE runner, then `just test <leg>`
#           smoke-tests the binary it produced (a binary can only be executed
#           on its own os/arch, so each leg is tested on its matching runner).
#           This gives the source builds (build-posix) real push/PR coverage
#           and keeps a broken build or binary from ever reaching a release;
#           the windows legs also carry the self-verifying import (a Renovate
#           CFW_PACKAGE bump PR cannot go green on a package that fails to
#           download or verify).
#   tools — every aqua pin installs for real (limen's canonical job).
#   gate  — the ONE required status check (the canonical limen:main ruleset
#           requires `gate`, see defaultRequiredChecks in limen's
#           internal/github/audit.go). It collapses lint and the whole build
#           matrix to one stable name, so the ruleset never has to know this
#           workflow's runner list.
#
# From limen's canonical ci.yaml: the aqua store cache on every job, the Go
# caches on lint (its Go-built tools and golangci-lint's cache), and the
# tools job. Not its fuzz job: there is no Go code here to fuzz.
#
# Cost note: the linux/macOS legs are ~full source builds of curl + deps, so
# this is heavy on every PR. Scope the `build` job to `push` if minutes bite.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# No default token permissions: each job states what it needs. This workflow
# only ever reads the repository — it cannot write code, releases, or
# packages even if a step is compromised.
permissions: {}

# A superseded run (new push to the same branch/PR) is cancelled, not raced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit bash everywhere: windows defaults to PowerShell and never sees
# git-bash's environment; explicit bash also brings -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: `just do lint commits` validates the commit range
          # against the PR's base branch, which a shallow clone lacks.
          fetch-depth: 0

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      # aqua's package store, keyed on the exact pins and per architecture
      # (the store holds native binaries). A warm store turns every lazy first
      # use below into a link; the fallback key keeps the tools a pin bump did
      # not touch, and the changed one downloads and verifies as before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AQUA_ROOT_DIR }}/pkgs
          key: aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.aqua/aqua.yaml', '.aqua/aqua-checksums.json', '.limen/aqua-registry.yaml') }}
          restore-keys: |
            aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned tools
        # Link-only: tools download lazily on first use, checksum-verified; a
        # job pays only for what its recipes run.
        run: aqua install --only-link

      # The Go build and module caches, plus the linter's (build/cache/, see
      # main.just). The per-platform analysis legs compile the whole module
      # graph five times, cold, on every run without this. Paths come from the
      # pinned go itself — they differ per OS — and the key carries its version
      # and every go.sum; a stale restore is harmless (the build cache is
      # content-addressed, the module cache is checksum-verified), so the
      # fallback key is always worth taking.
      - id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
            build/cache
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.gocache.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.gocache.outputs.version }}-
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Lint
        run: just lint

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-amd64
            runs-on: ubuntu-24.04
            build: build-posix linux-amd64
          - leg: linux-arm64
            runs-on: ubuntu-24.04-arm
            build: build-posix linux-arm64
          - leg: mac-arm64
            runs-on: macos-15
            build: build-posix mac-arm64
          - leg: windows-amd64
            runs-on: windows-2025
            build: build-windows
          - leg: windows-arm64
            runs-on: windows-11-arm
            build: build-windows
    name: build (${{ matrix.leg }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      # aqua's package store, keyed on the exact pins and per architecture
      # (the store holds native binaries). A warm store turns every lazy first
      # use below into a link; the fallback key keeps the tools a pin bump did
      # not touch, and the changed one downloads and verifies as before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AQUA_ROOT_DIR }}/pkgs
          key: aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.aqua/aqua.yaml', '.aqua/aqua-checksums.json', '.limen/aqua-registry.yaml') }}
          restore-keys: |
            aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned tools
        run: aqua install --only-link

      - name: Build
        run: just ${{ matrix.build }}
      - name: Smoke-test the native binary
        run: just test ${{ matrix.leg }}

  # Every pin resolves. The verify legs link only, and a link verifies
  # nothing: an asset that is missing from a release, or that fails its
  # checksum, would merge green and fail at first use. One linux leg pays for
  # the real install; aqua's package store is cached on the exact pins, so a
  # warm key costs seconds and a changed pin is always a real install. (The
  # Go-built tools are tools/go.mod directives, built by the verify legs.)
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AQUA_ROOT_DIR }}/pkgs
          # The same key as the verify legs', so this job and the linux leg
          # share one store — and no fallback key here: a changed pin must be
          # a real install, which is what this job exists to prove.
          key: aqua-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.aqua/aqua.yaml', '.aqua/aqua-checksums.json', '.limen/aqua-registry.yaml') }}

      - name: Install every pinned tool
        run: aqua install

  gate:
    needs: [lint, build, tools]
    # always(), and the results asserted explicitly: without always() a failed
    # or cancelled dependency SKIPS this job instead of failing it, and a
    # skipped required check does not block a merge. `needs.build.result` is
    # success only when every matrix leg succeeded.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Lint, every build leg and tools succeeded
        env:
          # Via env, never interpolated into the script: the shell sees data,
          # not something the expression layer can rewrite into code.
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_TOOLS: ${{ needs.tools.result }}
        run: |
          printf 'lint: %s\n' "$RESULT_LINT"
          printf 'build: %s\n' "$RESULT_BUILD"
          printf 'tools: %s\n' "$RESULT_TOOLS"
          [ "$RESULT_LINT" = "success" ] && [ "$RESULT_BUILD" = "success" ] && [ "$RESULT_TOOLS" = "success" ]
