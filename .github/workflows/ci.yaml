# build-curl CI (project-specific — this repo builds a C tool, not Go, so it
# diverges from the canonical baseline ci.yaml). Construction rules are the
# same: the only marketplace action is GitHub's own checkout pinned by commit
# SHA; everything else is pinned, checksum-verified shell via aqua + just.
#
# Two jobs:
#   lint  — the shared limen lint lane (shell/yaml/just/links/commits), once.
#   build — every release leg on its NATIVE runner, then `just test <leg>`
#           smoke-tests the binary it produced (a binary can only be executed
#           on its own os/arch, so each leg is tested on its matching runner).
#           This gives the source builds (build-posix) real push/PR coverage
#           and keeps a broken build or binary from ever reaching a release;
#           the windows legs also carry the self-verifying import (a Renovate
#           CFW_PACKAGE bump PR cannot go green on a package that fails to
#           download or verify).
#   gate  — the ONE required status check (the canonical limen:main ruleset
#           requires `gate`, see defaultRequiredChecks in limen's
#           internal/github/audit.go). It collapses lint and the whole build
#           matrix to one stable name, so the ruleset never has to know this
#           workflow's runner list.
#
# Cost note: the linux/macOS legs are ~full source builds of curl + deps, so
# this is heavy on every PR. Scope the `build` job to `push` if minutes bite.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history: `just do lint commits` validates the commit range
          # against the PR's base branch, which a shallow clone lacks.
          fetch-depth: 0
      - uses: ./.github/actions/setup-aqua
      - run: aqua install --only-link
      - run: just lint

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux-amd64
            runs-on: ubuntu-24.04
            build: build-posix linux-amd64
          - leg: linux-arm64
            runs-on: ubuntu-24.04-arm
            build: build-posix linux-arm64
          - leg: mac-arm64
            runs-on: macos-15
            build: build-posix mac-arm64
          - leg: windows-amd64
            runs-on: windows-2025
            build: build-windows
          - leg: windows-arm64
            runs-on: windows-11-arm
            build: build-windows
    name: build (${{ matrix.leg }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aqua
      - run: aqua install --only-link
      - name: Build
        run: just ${{ matrix.build }}
      - name: Smoke-test the native binary
        run: just test ${{ matrix.leg }}

  gate:
    needs: [lint, build]
    # always(), and the results asserted explicitly: without always() a failed
    # or cancelled dependency SKIPS this job instead of failing it, and a
    # skipped required check does not block a merge. `needs.build.result` is
    # success only when every matrix leg succeeded.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Lint and every build leg succeeded
        env:
          # Via env, never interpolated into the script: the shell sees data,
          # not something the expression layer can rewrite into code.
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_BUILD: ${{ needs.build.result }}
        run: |
          printf 'lint: %s\n' "$RESULT_LINT"
          printf 'build: %s\n' "$RESULT_BUILD"
          [ "$RESULT_LINT" = "success" ] && [ "$RESULT_BUILD" = "success" ]
