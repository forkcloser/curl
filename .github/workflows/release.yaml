# Release lane for build-curl (custom — this repo packages a C project, so
# the canonical goreleaser lane does not apply; same construction rules:
# SHA-pinned first-party actions only, minimal per-job permissions, bash
# everywhere).
#
# A pushed v* tag builds every platform leg, verifies + imports the windows
# packages from curl-for-win, generates GitHub Artifact Attestations for
# every archive (aqua verifies these natively on install), and publishes the
# release with a checksums.txt for aqua's checksum pinning.
#
# workflow_dispatch is the DRY RUN: every leg builds and uploads its workflow
# artifacts, and the publish job is skipped (tag refs only) — validate the
# whole pipeline without cutting a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

defaults:
  run:
    shell: bash

jobs:
  windows:
    # Import, not build: curl-for-win's windows packages ARE the official
    # curl builds — sigstore-verified against the vendored key, repackaged.
    # No smoke test here (ubuntu can't execute curl.exe); CI runs `just test`
    # on real windows runners for both arches at the same CFW_PACKAGE.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aqua
      - run: aqua install --only-link
      - run: just build-windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: build/dist/*.tar.gz

  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aqua
      - run: aqua install --only-link
      - run: just build-posix linux-amd64
      - run: just test linux-amd64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-amd64
          path: build/dist/*.tar.gz

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aqua
      - run: aqua install --only-link
      - run: just build-posix linux-arm64
      - run: just test linux-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-arm64
          path: build/dist/*.tar.gz

  mac:
    # darwin arm64 only — farcloser dropped Intel Mac support.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aqua
      - run: aqua install --only-link
      - run: just build-posix mac-arm64
      - run: just test mac-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-mac
          path: build/dist/*.tar.gz

  publish:
    # Tag pushes only: a workflow_dispatch run is a dry run — it proves every
    # build leg and stops here.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-amd64, linux-arm64, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Publish the release and its assets.
      contents: write
      # GitHub Artifact Attestations (keyless provenance; aqua verifies).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- *.tar.gz > checksums.txt
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag dist/*
